name: "Pyriksdagen: run example notebook"

on: [push]

jobs:
  notebooks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.13]
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v2
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install .
    - name: Test notebooks
      run: |
        pip install pytest nbmake
        pytest --nbmake **/*ipynb
  unittest:
    runs-on: ubuntu-latest
    env:
      METADATA_PATH: riksdagen-persons/data
    strategy:
      matrix:
        python-version: [3.13]
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v2
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install .
    - name: Clone riksdagen-persons 
      run: |
        git clone https://github.com/swerik-project/riksdagen-persons.git
    - name: Test utils
      run: |
        python -m unittest test.utils
