[project]
name = "pyriksdagen"
version = "v2.0.0"
description = "Access the Riksdagen corpus"
authors = [
    {name="ninpnin", email= "vainoyrjanainen@icloud.com"}
]
repository = "https://github.com/welfare-state-analytics/riksdagen-corpus"
readme = "README.md"
license = "MIT"
packages = [
    { include = "pyriksdagen", from = "" }
]
requires-python = ">=3.7"
dependencies = [
    "pyparlaclarin",
    "polars",
    "base58",
    "kblab-client",
    "progressbar2",
    "lxml",
    "xmlschema",
    "unidecode",
    "dateparser",
    "beautifulsoup4",
    "requests",
    "numpy",
    "SPARQLWrapper",
    "tqdm",
    "matplotlib",
    "importlib_resources",
    "nltk",
    "textdistance",
    "py-markdown-table",
    "alto-xml",
    "trainerlog",
]

[project.optional-dependencies]
torch = ["torch", "transformers"]

[tool.poetry.dev-dependencies]
devtools = "^0.5.1"

[build-system]
requires = ["poetry>=0.12"]
build-backend = "poetry.masonry.api"
